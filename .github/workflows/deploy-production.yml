name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # NOTE: ตัด migrate deploy ออกชั่วคราว — DB production สร้างด้วย db push
      # ไม่ได้สร้างด้วย migrate ทำให้ _prisma_migrations มีแค่ 2 แถวและ P3009
      # บล็อกทุก deploy (Vercel ไม่ได้ deploy ตามไปด้วย) ทั้งที่ app รันได้ปกติ
      # ถ้าวันไหนอยากกลับมาใช้ migrate ให้ baseline DB ก่อน (resolve --applied
      # ทั้ง 12 migrations หลัง migrate diff ว่าง) แล้วค่อยเอา step นี้กลับมา

      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
